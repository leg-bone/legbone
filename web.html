  <script>
    (function () {
      const overlay = document.getElementById('intro-overlay');
      const introVideo = document.getElementById('intro-load-video');

      function fadeIntroAway() {
        if (!overlay || overlay.classList.contains('fade-out')) {
          return;
        }

        overlay.classList.add('fade-out');
        window.setTimeout(function () {
          overlay.remove();
        }, 1100);
      }

      if (!introVideo) {
        fadeIntroAway();
        return;
      }

      introVideo.addEventListener('ended', fadeIntroAway);
      introVideo.addEventListener('error', fadeIntroAway);

      introVideo.play().catch(function () {
        fadeIntroAway();
      });
    })();


  </script>
