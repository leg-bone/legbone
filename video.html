  <script>
    (function () {
      const overlay = document.getElementById('intro-overlay');
      const introVideo = document.getElementById('intro-load-video');

      function fadeIntroAway() {
        if (!overlay || overlay.classList.contains('fade-out')) {
          return;
        }

        overlay.classList.add('fade-out');
        window.setTimeout(function () {
          overlay.remove();
        }, 1100);
      }

      if (!introVideo) {
        fadeIntroAway();
        return;
      }

      introVideo.addEventListener('ended', fadeIntroAway);
      introVideo.addEventListener('error', fadeIntroAway);

      introVideo.play().catch(function () {
        fadeIntroAway();
      });
    })();

    function sendYouTubeCommand(iframe, command, args) {
      const payload = {
        event: 'command',
        func: command,
        args: args || []
      };
      iframe.contentWindow.postMessage(JSON.stringify(payload), '*');
    }

    function playHtmlVideo(video) {
      video.play().catch(function () {
        video.muted = true;
        video.play().catch(function () {});
      });
    }

    document.querySelectorAll('#video .media-item').forEach(function (item) {
      const htmlVideo = item.querySelector('video');
      const youtubeFrame = item.querySelector('iframe[src*="youtube.com/embed"]');

      if (htmlVideo) {
        htmlVideo.loop = true;
      }

      item.addEventListener('mouseenter', function () {
        if (htmlVideo) {
          playHtmlVideo(htmlVideo);
        }

        if (youtubeFrame) {
          sendYouTubeCommand(youtubeFrame, 'mute');
          sendYouTubeCommand(youtubeFrame, 'playVideo');
        }
      });

      item.addEventListener('mouseleave', function () {
        if (htmlVideo) {
          htmlVideo.pause();
          htmlVideo.currentTime = 0;
        }

        if (youtubeFrame) {
          sendYouTubeCommand(youtubeFrame, 'stopVideo');
        }
      });
    });

    (function () {
      const viewNode = document.querySelector('#video .live-view-count[data-video-id]');
      if (!viewNode) {
        return;
      }

      const styleTag = document.createElement('style');
      styleTag.textContent = [
        '.live-view-count {',
        
    
        '  text-align: center;',
        '  gap: 0.4em;',
        '}',
        '.live-view-count .live-view-asterisk {',
        '  animation: live-view-asterisk-blink 1s step-end infinite;',
        '}',
        '@keyframes live-view-asterisk-blink {',
        '  0%, 50% { opacity: 1; }',
        '  50.01%, 100% { opacity: 0; }',
        '}'
      ].join('\n');
      document.head.appendChild(styleTag);

      const asteriskNode = document.createElement('span');
      asteriskNode.className = 'live-view-asterisk';
      asteriskNode.setAttribute('aria-hidden', 'true');
      asteriskNode.textContent = '*';

      const textNode = document.createElement('span');
      textNode.className = 'live-view-text';

      viewNode.textContent = '';
      viewNode.appendChild(asteriskNode);
      viewNode.appendChild(textNode);

      const videoId = viewNode.getAttribute('data-video-id');
      const endpoint = 'https://returnyoutubedislikeapi.com/votes?videoId=' + encodeURIComponent(videoId);
      let simulatedViewCount = null;

      function formatViews(value) {
        return Number(value).toLocaleString('en-US');
      }

      function renderViews(value) {
        textNode.textContent = 'Views: ' + formatViews(value);
      }

      function setViewCount(value) {
        simulatedViewCount = Math.max(0, Math.floor(Number(value) || 0));
        renderViews(simulatedViewCount);
      }

      function refreshViews() {
        fetch(endpoint)
          .then(function (response) {
            if (!response.ok) {
              throw new Error('Bad response');
            }
            return response.json();
          })
          .then(function (data) {
            if (typeof data.viewCount !== 'number') {
              throw new Error('No viewCount');
            }
            setViewCount(data.viewCount);
          })
          .catch(function () {
            if (simulatedViewCount === null) {
              setViewCount(0);
            }
          });
      }

      window.setInterval(function () {
        if (simulatedViewCount === null) {
          return;
        }
        setViewCount(simulatedViewCount + 1);
      }, 30000);

      refreshViews();
      window.setInterval(refreshViews, 60000);
    })();
  </script>
