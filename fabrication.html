<section id="video">
  <div class="container">


    <figure class="media-item">
      <iframe width="30%" src="https://www.youtube.com/embed/MKGNd_tDQ3o?si=0axqjHjZW2HBNv_2&enablejsapi=1&playsinline=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      <figcaption><i>Gator in the Water</i>, sculptural installation. Made for NYU ITP/IMA Spring Show. Projection mapping, 2022.</figcaption>
    </figure>


    <figure class="media-item box2">
      <a class="embed-link" href="https://pilat.ai/WeavingIntelligence_exhibition.html" target="_blank" rel="noopener noreferrer" aria-label="Open pilat site"></a>
      <embed class="site-preview" src="https://pilat.ai/WeavingIntelligence_exhibition.html" style="width:100%; height:70vh; background-color:#ffffff; border-radius:5px; zoom:60%">
      <figcaption>Mechanical engineering & installation for <i>Weaving Intelligence</i> by Agnieszka Pilat at the 18th Triennial of Tapestry. Centralne Muzeum Włókiennictwa, Łódź, Poland, 2025.</figcaption>
    </figure>
  </div>
</section>

  <script>
    (function () {
      const overlay = document.getElementById('intro-overlay');
      const introVideo = document.getElementById('intro-load-video');

      function fadeIntroAway() {
        if (!overlay || overlay.classList.contains('fade-out')) {
          return;
        }

        overlay.classList.add('fade-out');
        window.setTimeout(function () {
          overlay.remove();
        }, 1100);
      }

      if (!introVideo) {
        fadeIntroAway();
        return;
      }

      introVideo.addEventListener('ended', fadeIntroAway);
      introVideo.addEventListener('error', fadeIntroAway);

      introVideo.play().catch(function () {
        fadeIntroAway();
      });
    })();

    function sendYouTubeCommand(iframe, command, args) {
      const payload = {
        event: 'command',
        func: command,
        args: args || []
      };
      iframe.contentWindow.postMessage(JSON.stringify(payload), '*');
    }

    function playHtmlVideo(video) {
      video.play().catch(function () {
        video.muted = true;
        video.play().catch(function () {});
      });
    }

    document.querySelectorAll('#video .media-item').forEach(function (item) {
      const htmlVideo = item.querySelector('video');
      const youtubeFrame = item.querySelector('iframe[src*="youtube.com/embed"]');

      item.addEventListener('mouseenter', function () {
        if (htmlVideo) {
          playHtmlVideo(htmlVideo);
        }

        if (youtubeFrame) {
          sendYouTubeCommand(youtubeFrame, 'mute');
          sendYouTubeCommand(youtubeFrame, 'playVideo');
        }
      });

      item.addEventListener('mouseleave', function () {
        if (htmlVideo) {
          htmlVideo.pause();
          htmlVideo.currentTime = 0;
        }

        if (youtubeFrame) {
          sendYouTubeCommand(youtubeFrame, 'stopVideo');
        }
      });
    });
  </script>


  </body>
</html>
