<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>legbone.net</title>
    <link rel="stylesheet" href="./css/style0.css">
    <link rel="shortcut icon" type="image/png" href="ok3.png">
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.167.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.167.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
<header>
  <div class="container">
    <div id="branding">
      <h1>legbone.net</h1>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">art</a></li>
        <li><a href="communication.html">communication</a></li>
      </ul>
    </nav>
  </div>
</header>



  <section id="boxes">

  <section id="text-viewer">
    <div class="container0">
      <div id="text-viewer-canvas"></div>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPixelatedPass } from 'three/addons/postprocessing/RenderPixelatedPass.js';

    // change this to display a different word/phrase in the viewer
    const displayText = 'charlie@legbone.net';

    const mount = document.getElementById('text-viewer-canvas');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(20, mount.clientWidth / mount.clientHeight, 0.1, 100);
    camera.position.set(0, 0, 85);


    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(mount.clientWidth, mount.clientHeight);
    mount.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    const pixelPass = new RenderPixelatedPass(4, scene, camera);
    composer.addPass(pixelPass);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
    keyLight.position.set(5, 10, 10);
    scene.add(keyLight);

    const starCount = 500;
    const starPositions = new Float32Array(starCount * 3);
    const starPhases = new Float32Array(starCount);
    const starSpeeds = new Float32Array(starCount);
    const starSizes = new Float32Array(starCount);

    for (let i = 0; i < starCount; i++) {
      starPositions[i * 3] = (Math.random() - 0.5) * 70;
      starPositions[i * 3 + 1] = (Math.random() - 0.5) * 50;
      starPositions[i * 3 + 2] = -Math.random() * 40 - 5;
      starPhases[i] = Math.random() * Math.PI * 2;
      starSpeeds[i] = 0.5 + Math.random() * 2;
      starSizes[i] = 4 + Math.random() * 8;
    }

    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 4));
    starGeometry.setAttribute('aPhase', new THREE.BufferAttribute(starPhases, 1));
    starGeometry.setAttribute('aSpeed', new THREE.BufferAttribute(starSpeeds, 1));
    starGeometry.setAttribute('aSize', new THREE.BufferAttribute(starSizes, 1));

    const starMaterial = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        attribute float aPhase;
        attribute float aSpeed;
        attribute float aSize;
        uniform float uTime;
        varying float vAlpha;
        void main() {
          vAlpha = 0.3 + 0.7 * (0.5 + 0.5 * sin(uTime * aSpeed + aPhase));
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * (20.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying float vAlpha;
        void main() {
          float d = distance(gl_PointCoord, vec2(0.5));
          if (d > 0.5) discard;
          float edge = smoothstep(.4, 0.0, d);
          gl_FragColor = vec4(1.0, 1.0, 1.0, vAlpha * edge);
        }
      `
    });

    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // envelope body + a pair of mirrored wings that hinge at the sides and flap in-plane
    function createMailBird() {
      const group = new THREE.Group();

      const bodyGeometry = new THREE.BoxGeometry(2.2, 1.4, 0.15);
      const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0xf5f0e1, roughness: 0.6 });
      const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
      group.add(body);

      const flapShape = new THREE.Shape();
      flapShape.moveTo(-1.1, 0.7);
      flapShape.lineTo(1.1, 0.7);
      flapShape.lineTo(0, -0.1);
      flapShape.closePath();
      const flapGeometry = new THREE.ExtrudeGeometry(flapShape, { depth: 0.02, bevelEnabled: false });
      const flapMaterial = new THREE.MeshStandardMaterial({ color: 0xd8d0b8, roughness: 0.6 });
      const flap = new THREE.Mesh(flapGeometry, flapMaterial);
      flap.position.z = 0.08;
      group.add(flap);

      const wingShape = new THREE.Shape();
      wingShape.moveTo(0, 0.3);
      wingShape.lineTo(0, -0.3);
      wingShape.lineTo(1.8, -0.1);
      wingShape.lineTo(1.4, 0.4);
      wingShape.closePath();
      const wingGeometry = new THREE.ExtrudeGeometry(wingShape, { depth: 0.05, bevelEnabled: false });
      const wingMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide, roughness: 0.7 });

      const leftWing = new THREE.Mesh(wingGeometry, wingMaterial);
      leftWing.position.set(-.8, .3, 0);
      leftWing.scale.x = -1;
      group.add(leftWing);

      const rightWing = new THREE.Mesh(wingGeometry, wingMaterial);
      rightWing.position.set(.8, .3, 0);
      group.add(rightWing);

      return { group, leftWing, rightWing };
    }

    let mailBirds = [0, 1, 2].map((i) => {
      const bird = createMailBird();
      bird.radiusX = 30 + i * 4;
      bird.radiusY = 6 + i * 2;
      bird.speed = 0.3 + i * 0.1;
      bird.phase = i * Math.PI * 0.7;
      bird.baseZ = -6 - i * 4;
      bird.flapSpeed = 30 + i;
      scene.add(bird.group);
      return bird;
    });

    const poofs = [];

    function spawnPoof(position) {
      const count = 24;
      const positions = new Float32Array(count * 3);
      const origins = new Float32Array(count * 3);
      const velocities = new Float32Array(count * 3);
      for (let j = 0; j < count; j++) {
        positions[j * 3] = origins[j * 3] = position.x;
        positions[j * 3 + 1] = origins[j * 3 + 1] = position.y;
        positions[j * 3 + 2] = origins[j * 3 + 2] = position.z;
        const dir = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5)
          .normalize()
          .multiplyScalar(2 + Math.random() * 4);
        velocities[j * 3] = dir.x;
        velocities[j * 3 + 1] = dir.y;
        velocities[j * 3 + 2] = dir.z;
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.6,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const points = new THREE.Points(geometry, material);
      scene.add(points);
      poofs.push({ points, origins, velocities, startTime: clock.getElapsedTime(), duration: 0.6 });
    }

    function startPoof(bird) {
      bird.popping = true;
      bird.popStart = clock.getElapsedTime();
      bird.group.traverse((obj) => {
        if (obj.material) {
          obj.material = obj.material.clone();
          obj.material.transparent = true;
        }
      });
      spawnPoof(bird.group.position);
    }

    mount.addEventListener('click', (event) => {
      const rect = mount.getBoundingClientRect();
      pointerNDC.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);

      let hitBird = false;
      for (const bird of mailBirds) {
        if (bird.popping) continue;
        if (raycaster.intersectObject(bird.group, true).length) {
          startPoof(bird);
          hitBird = true;
          break;
        }
      }

      if (!hitBird && textHitArea && raycaster.intersectObject(textHitArea).length) {
        copyEmailToClipboard();
        cycleFont();
        clickGlowStart = clock.getElapsedTime();
      }
    });

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = .1;
    controls.enableZoom = false;

    let textMesh;
    let textHitArea;
    let isHovering = false;
    let clickGlowStart = -Infinity;
    const textGlowColor = new THREE.Color(0x8a2be2);
    const clickFlashColor = new THREE.Color(0x00ff00);
    let loadedFont;
    let messageMesh;
    let messageStart;

    function showMessage(text) {
      if (messageMesh) {
        scene.remove(messageMesh);
        messageMesh.geometry.dispose();
        messageMesh.material.dispose();
        messageMesh = null;
      }
      if (!loadedFont) return;
      const geometry = new TextGeometry(text, {
        font: loadedFont,
        size: 0.9,
        depth: 0.2,
        curveSegments: 1,
        bevelEnabled: false
      });
      geometry.center();
      const material = new THREE.MeshStandardMaterial({
        color: 0x00ff00,
        emissive: 0x003300,
        transparent: true,
        opacity: 0
      });
      messageMesh = new THREE.Mesh(geometry, material);
      messageMesh.position.set(0, -5, 1);
      messageStart = clock.getElapsedTime();
      scene.add(messageMesh);
    }

    function copyEmailToClipboard() {
      navigator.clipboard
        .writeText(displayText)
        .then(() => showMessage('email successfully copied to clipboard...'))
        .catch(() => showMessage('copy failed - please copy manually'));
    }

    // arrow shape traced tip-first so mesh position (0,0) is the pointer's tip
    const cursorShape = new THREE.Shape();
    cursorShape.moveTo(0, 0);
    cursorShape.lineTo(0, -1.2);
    cursorShape.lineTo(0.28, -0.92);
    cursorShape.lineTo(0.48, -1.4);
    cursorShape.lineTo(0.68, -1.32);
    cursorShape.lineTo(0.48, -0.86);
    cursorShape.lineTo(0.86, -0.86);
    cursorShape.closePath();

    const cursorGeometry = new THREE.ExtrudeGeometry(cursorShape, {
      depth: 0.2,
      bevelEnabled: false,
      bevelThickness: 0.05,
      bevelSize: 0.01,
      bevelSegments: 2
    });
    const cursorMaterial = new THREE.MeshStandardMaterial({
      color: 0x00ff00,
      emissive: 0x003300,
      metalness: .1,
      roughness: 0.3
    });
    const cursorMesh = new THREE.Mesh(cursorGeometry, cursorMaterial);
    cursorMesh.scale.setScalar(2.2);
    cursorMesh.position.set(0, 0, 2);
    scene.add(cursorMesh);

    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const trackingPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -2);
    const pointerTarget = new THREE.Vector3(0, 0, 2);

    mount.addEventListener('pointermove', (event) => {
      const rect = mount.getBoundingClientRect();
      pointerNDC.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      isHovering = textHitArea ? raycaster.intersectObject(textHitArea).length > 0 : false;
      raycaster.ray.intersectPlane(trackingPlane, pointerTarget);
    });

    const fontUrls = [
      'https://unpkg.com/three@0.167.1/examples/fonts/helvetiker_regular.typeface.json',
      'https://unpkg.com/three@0.167.1/examples/fonts/optimer_regular.typeface.json',
      'https://unpkg.com/three@0.167.1/examples/fonts/gentilis_regular.typeface.json',
      'https://unpkg.com/three@0.167.1/examples/fonts/droid_sans_regular.typeface.json',
 
    ];
    let fontIndex = 0;
    const fontLoader = new FontLoader();

    function applyFont(font) {
      const geometry = new TextGeometry(displayText, {
        font,
        size: 3,
        depth: 0.8,
        curveSegments: 1,
        bevelEnabled: true,
        bevelThickness: 0.15,
        bevelSize: 0.1,
        bevelSegments: 5
      });
      geometry.center();

      if (textMesh) {
        textMesh.geometry.dispose();
        textMesh.geometry = geometry;
      } else {
        const material = new THREE.MeshStandardMaterial({
          color: 0x8a2be2,
          metalness: 0.3,
          roughness: 0.4,
          emissive: 0x8a2be2,
          emissiveIntensity: 0
        });
        textMesh = new THREE.Mesh(geometry, material);
        scene.add(textMesh);

        // invisible, padded stand-in so hover/click hit-testing isn't limited to the exact letter shapes
        const hitMaterial = new THREE.MeshBasicMaterial({ visible: false });
        textHitArea = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), hitMaterial);
        textMesh.add(textHitArea);
      }

      geometry.computeBoundingBox();
      const size = new THREE.Vector3();
      geometry.boundingBox.getSize(size);
      const center = new THREE.Vector3();
      geometry.boundingBox.getCenter(center);
      const padding = 1.5;
      textHitArea.scale.set(size.x + padding, size.y + padding, size.z + padding);
      textHitArea.position.copy(center);

      loadedFont = font;
    }

    function cycleFont() {
      fontIndex = (fontIndex + 1) % fontUrls.length;
      fontLoader.load(fontUrls[fontIndex], applyFont);
    }

    fontLoader.load(fontUrls[fontIndex], applyFont);

    function onResize() {
      camera.aspect = mount.clientWidth / mount.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(mount.clientWidth, mount.clientHeight);
      composer.setSize(mount.clientWidth, mount.clientHeight);
    }
    window.addEventListener('resize', onResize);

    const clock = new THREE.Clock();

    renderer.setAnimationLoop(() => {
      const elapsed = clock.getElapsedTime();
      const bob = Math.sin(elapsed * 2) * 0.3;

      starMaterial.uniforms.uTime.value = elapsed;

      mailBirds.forEach((bird) => {
        if (bird.popping) {
          const t = Math.min((elapsed - bird.popStart) / 0.4, 1);
          const scale = Math.sin(Math.PI * t) * 0.6 + (1 - t) * 0.4;
          bird.group.scale.setScalar(Math.max(scale, 0));
          bird.group.traverse((obj) => {
            if (obj.material) obj.material.opacity = 1 - t;
          });
          return;
        }
        const angle = elapsed * bird.speed + bird.phase;
        bird.group.position.set(
          Math.cos(angle) * bird.radiusX,
          Math.sin(angle * 0.8) * bird.radiusY,
          bird.baseZ + Math.sin(angle * 0.5) * 2
        );
        bird.group.rotation.z = Math.sin(angle) * 0.2;
        const flap = 0.3 + Math.sin(elapsed * bird.flapSpeed + bird.phase) * 0.6;
        bird.leftWing.rotation.z = flap;
        bird.rightWing.rotation.z = -flap;
      });

      mailBirds = mailBirds.filter((bird) => {
        if (bird.popping && elapsed - bird.popStart >= 0.4) {
          scene.remove(bird.group);
          return false;
        }
        return true;
      });

      for (let i = poofs.length - 1; i >= 0; i--) {
        const poof = poofs[i];
        const t = (elapsed - poof.startTime) / poof.duration;
        if (t >= 1) {
          scene.remove(poof.points);
          poof.points.geometry.dispose();
          poof.points.material.dispose();
          poofs.splice(i, 1);
          continue;
        }
        const positions = poof.points.geometry.attributes.position.array;
        for (let j = 0; j < positions.length; j++) {
          positions[j] = poof.origins[j] + poof.velocities[j] * t;
        }
        poof.points.geometry.attributes.position.needsUpdate = true;
        poof.points.material.opacity = 1 - t;
      }

      if (textMesh) {
        const clickFlash = Math.max(0, 1 - (elapsed - clickGlowStart) / 0.6);
        textMesh.material.emissive.lerpColors(textGlowColor, clickFlashColor, clickFlash);

        const targetIntensity = Math.max(isHovering ? 1.8 : 0, clickFlash * 3);
        textMesh.material.emissiveIntensity += (targetIntensity - textMesh.material.emissiveIntensity) * 0.2;

        // scaling z fakes thicker extrusion without rebuilding the geometry
        const targetThickness = isHovering ? 2 : 1;
        textMesh.scale.z += (targetThickness - textMesh.scale.z) * 0.5;
      }

      if (messageMesh) {
        const age = elapsed - messageStart;
        const fadeIn = Math.min(age / 0.3, 1);
        const fadeOut = 1 - Math.max((age - 2.2) / 0.5, 0);
        messageMesh.material.opacity = Math.max(Math.min(fadeIn, fadeOut), 0);
        if (age > 2.7) {
          scene.remove(messageMesh);
          messageMesh.geometry.dispose();
          messageMesh.material.dispose();
          messageMesh = null;
        }
      }

      cursorMesh.position.x += (pointerTarget.x - cursorMesh.position.x) * 0.15;
      cursorMesh.position.y += (pointerTarget.y + bob - cursorMesh.position.y) * 0.15;
      cursorMesh.rotation.z = Math.sin(elapsed) * 0.1;

      controls.update();
      composer.render();
    });
  </script>

  </body>
</html>
